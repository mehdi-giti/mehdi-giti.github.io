const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),K='pitch-deck-fa:key';
async function open_(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(C));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(D.s),iterations:D.n},base,256));}
(async()=>{try{const k=sessionStorage.getItem(K);if(k)await open_(u8(k));}catch(e){try{sessionStorage.removeItem(K);}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;err.textContent='';
  try{const raw=await derive(document.getElementById('pw').value);
    if(document.getElementById('keep').checked){try{sessionStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}}
    await open_(raw);}
  catch(x){err.textContent='رمز عبور درست نیست.';go.disabled=false;}});
