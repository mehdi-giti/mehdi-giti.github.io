<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Financial plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#1a1a19;--inner:#131312;--line:#2c2b29;--ink:#f2f0eb;--muted:#a9a59c;--accent:#ff7a1a;--s1:#e8650a;--s2:#3987d1}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[lang=fa] body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.8}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding:0 clamp(14px,2vw,32px)}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 50% 0,#2a1505 0,var(--bg) 70%)}
#gate form{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
#gate h1{margin:0 0 6px;font-size:22px}
#gate p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;height:46px;border-radius:10px;border:1px solid #45423d;background:#0f0f10;color:var(--ink);padding:0 14px;font:inherit;direction:ltr}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.primary{width:100%;height:46px;margin-top:14px;border:0;border-radius:10px;background:var(--accent);color:#120800;font-weight:700}
#err{color:#ffb38a;font-size:14px;min-height:22px;margin-top:10px}
.lang{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #45423d;background:transparent;color:var(--ink);font-size:14px}
#gate .lang{margin-top:14px;width:100%}
#app{display:none}
nav{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px 22px;flex-wrap:wrap;align-items:center;padding-top:8px;padding-bottom:8px}
nav b{color:var(--accent);margin-inline-end:auto;letter-spacing:.04em}
nav a{color:var(--ink);text-decoration:none;font-size:14px;padding:10px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--accent)}
nav a.on{border-bottom-color:var(--accent);color:var(--accent)}
header.hero{position:relative;overflow:hidden;padding:64px 0 44px;background:radial-gradient(1000px 420px at 20% -10%,#3a1c05 0,transparent 70%)}
#net{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.hero h1{font-size:clamp(32px,4.6vw,60px);line-height:1.15;margin:10px 0 14px;max-width:24ch}
.hero p{color:#c9c5bc;max-width:75ch;margin:0;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:36px}
.tile{background:rgba(26,26,25,.88);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.tile .k{color:var(--muted);font-size:14px}
.tile .v{font-size:36px;font-weight:700;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .u{color:var(--muted);font-size:14px}
section{padding:56px 0;border-top:1px solid var(--line);scroll-margin-top:60px}
h2{font-size:30px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 26px;max-width:80ch}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.metric h3{margin:0 0 2px;font-size:19px}
.metric .q{color:var(--muted);font-size:14px;margin-bottom:16px}
.bar{display:grid;grid-template-columns:minmax(120px,34%) 1fr auto;gap:12px;align-items:center;margin-top:12px}
.bar .d{color:#d9d5cc;font-size:14px}
.bar .t{height:22px;background:#262523;border-radius:6px;overflow:hidden}
.bar .f{display:block;height:100%;background:var(--s1);border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1) .15s}
.in .bar .f{width:var(--w)}
.bar .n{font-size:30px;font-weight:700;min-width:3ch;text-align:end;line-height:1;font-variant-numeric:tabular-nums}
.people{display:flex;gap:6px;flex-wrap:wrap}
.people i{width:18px;height:24px;border-radius:9px 9px 4px 4px;background:var(--s1);display:inline-block;transition:opacity .35s,transform .35s}
.people i.off{opacity:.16}
.note{color:var(--muted);font-size:14px;margin-top:14px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2vw,30px)}
.tlhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-bottom:22px}
.play{min-height:48px;min-width:150px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:#120800;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.tlmonth{min-width:200px}
.tlmonth b{display:block;font-size:30px;line-height:1.25}
.tlmonth small{color:var(--muted);font-size:14px}
.tlhead input[type=range]{flex:1 1 260px;height:44px;accent-color:var(--accent);margin:0}
.tlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.tlb{background:var(--inner);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.tlb h3{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.tlb .big{font-size:52px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.marks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;margin-top:10px;max-width:520px}
.marks i{display:block;aspect-ratio:1;border-radius:50%;background:#2a2927;transition:background-color .35s,transform .35s}
.marks i.on{background:var(--s1);transform:scale(1)}
.marks.sq i{border-radius:22%}
.tlmoney{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.mrow{display:grid;grid-template-columns:minmax(110px,24%) 1fr minmax(70px,auto);gap:12px;align-items:center;margin:10px 0}
.mrow .ml{color:#d9d5cc;font-size:14px}
.mrow .mt{height:24px;background:#262523;border-radius:6px;overflow:hidden}
.mrow .mf{display:block;height:100%;border-radius:6px;width:0;transition:width .55s ease}
.mrow .mn{font-size:26px;font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.msum{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%;align-items:center}
.msum span{display:block;color:var(--muted);font-size:14px}
.msum b{font-size:44px;line-height:1.2;font-variant-numeric:tabular-nums}
.neg{color:#ffb38a}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.atile{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:20px 22px}
.atile .big{font-size:44px;font-weight:700;line-height:1.2}
.atile .lab{font-weight:600;font-size:17px;margin-top:2px}
.atile .sub{color:var(--muted);font-size:14px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 12px;position:relative;min-width:0}
.chart.wide{grid-column:1/-1}
.chart h3{margin:0;font-size:19px}
.chart .sub{color:var(--muted);font-size:14px;margin:2px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:#d9d5cc;margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.chart svg{display:block;width:100%;height:auto;direction:ltr}
.chart rect.bm{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.chart rect.bm.dn{transform-origin:top}
.chart.in rect.bm{transform:scaleY(1)}
.chart path.lp{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.5s ease .1s}
.chart.in path.lp{stroke-dashoffset:0}
.chart text.late{opacity:0;transition:opacity .5s ease .9s}
.chart.in text.late{opacity:1}
.tip{position:absolute;pointer-events:none;background:#0f0f10;border:1px solid #45423d;border-radius:8px;padding:8px 10px;font-size:13px;display:none;min-width:160px;z-index:3}
.tip b{display:block;margin-bottom:2px}
.tip span{display:flex;justify-content:space-between;gap:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 16px;text-align:end;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
th:first-child,td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--card)}
tr.total td{font-weight:700}
tr.head td{color:var(--accent);font-weight:700;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 12px}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #45423d;background:transparent;color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#120800;font-weight:700}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.avatar{width:56px;height:56px;border-radius:50%;background:#2a1505;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.person h3{margin:0;font-size:19px}
.person .from{color:var(--muted);font-size:14px}
.person .sal{font-size:44px;font-weight:700;line-height:1.2;margin-top:10px;font-variant-numeric:tabular-nums}
.person .per{color:var(--muted);font-size:14px}
.person .later{display:flex;gap:28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);min-height:62px}
.person .later b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.teamhead{padding-top:56px;padding-bottom:8px}
.teamhead h1{font-size:clamp(32px,4.6vw,56px);line-height:1.15;margin:0 0 10px}
footer{padding:28px 0 48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media (max-width:760px){nav .wrap{flex-wrap:nowrap;overflow-x:auto;gap:0 18px;scrollbar-width:none}nav .wrap::-webkit-scrollbar{display:none}nav b{display:none}nav a,nav .lang{white-space:nowrap;flex:0 0 auto}section{padding:40px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="gate">
  <form id="f" autocomplete="off">
    <h1 data-t="gateTitle"></h1>
    <p data-t="gateText"></p>
    <label for="pw" data-t="pwLabel"></label>
    <input id="pw" type="password" required autofocus>
    <button class="primary" type="submit" data-t="open"></button>
    <div id="err" role="alert"></div>
    <button class="lang" type="button" data-lang></button>
  </form>
</div>
<div id="app">
  <nav><div class="wrap"><b data-t="brand"></b><a href="#glance" data-t="navGlance"></a><a href="#timeline" data-t="navTimeline"></a><a href="#charts" data-t="navCharts"></a><a href="#assumptions" data-t="navAssum"></a><a href="#statements" data-t="navStatements"></a><a href="#team" data-t="navTeam"></a><button class="lang" type="button" data-lang></button></div></nav>
  <div id="view-plan">
    <header class="hero"><canvas id="net" aria-hidden="true"></canvas><div class="wrap">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <div class="tiles" id="tiles"></div>
    </div></header>
    <section id="glance"><div class="wrap"><h2 data-t="navGlance"></h2><p class="lead" data-t="glanceLead"></p><div class="glance" id="glancegrid"></div></div></section>
    <section id="timeline"><div class="wrap"><h2 data-t="navTimeline"></h2><p class="lead" data-t="tlLead"></p><div id="tlbox"></div></div></section>
    <section id="charts"><div class="wrap"><h2 data-t="navCharts"></h2><p class="lead" data-t="chartsLead"></p><div class="charts" id="chartgrid"></div></div></section>
    <section id="assumptions"><div class="wrap"><h2 data-t="assumH"></h2><p class="lead" data-t="assumLead"></p><div class="kgrid" id="kgrid"></div></div></section>
    <section id="statements"><div class="wrap"><h2 data-t="stH"></h2><p class="lead" data-t="stLead"></p>
      <div class="scroll"><table id="ytable"></table></div>
      <div class="tabs" id="tabs"></div>
      <div class="scroll"><table id="mtable"></table></div>
    </div></section>
  </div>
  <div id="view-team" hidden>
    <div class="wrap teamhead"><div class="eyebrow" data-t="eyebrow"></div><h1 data-t="navTeam"></h1><p class="lead" data-t="teamLead"></p></div>
    <div class="wrap"><div class="tiles" id="teamtiles" style="margin:0 0 24px"></div><div class="team" id="teamgrid"></div><div class="charts" id="teamchart" style="margin:24px 0 56px"></div></div>
  </div>
  <footer><div class="wrap" data-t="footer"></div></footer>
</div>

  const move = ev => {

    tip.innerHTML = `<b>${labels[i]}</b>` + c.series.map(se => `<span><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${se.c};margin-inline-end:6px"></i>${se.n}</span><span>${fmt(se.v[i])}</span></span>`).join('');

function net(){
