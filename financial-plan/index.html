<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090a;--ink:#f1efea;--muted:#a5a199;--faint:#85817a;--accent:#ffa76b;--a:255,167,107;--glass:rgba(255,255,255,.035);--line:rgba(255,255,255,.08);--track:rgba(255,255,255,.07);--s1:#d17a41;--s2:#5b96d6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1100px 560px at 12% -8%,rgba(var(--a),.09),transparent 62%),radial-gradient(900px 520px at 96% 38%,rgba(var(--a),.035),transparent 60%),var(--bg);background-attachment:fixed}
html[lang=fa] body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.8}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding:0 clamp(14px,2vw,32px)}
.tile,.metric,.panel,.atile,.person,.ctrl,.chart,.scroll{background:var(--glass);border:1px solid var(--line);border-radius:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
button{font:inherit;cursor:pointer}
.lang{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px}
#app{display:block}
nav{position:sticky;top:0;z-index:5;background:rgba(9,9,10,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px 22px;flex-wrap:wrap;align-items:center;padding-top:8px;padding-bottom:8px}
nav b{color:var(--accent);margin-inline-end:auto;letter-spacing:.06em;font-weight:600;font-size:14px}
nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:10px 0;border-bottom:1px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{border-bottom-color:var(--accent);color:var(--ink)}
header.hero{padding:60px 0 40px}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.hero h1{font-size:clamp(30px,4vw,54px);line-height:1.15;margin:10px 0 14px;max-width:24ch;font-weight:650}
.hero p{color:var(--muted);max-width:75ch;margin:0;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:34px}
.tile{padding:18px 22px}
.tile .k{color:var(--muted);font-size:14px}
.tile .v{font-size:34px;font-weight:650;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .u{color:var(--muted);font-size:14px}
section{padding:48px 0;border-top:1px solid var(--line);scroll-margin-top:61px}
#overview{padding-top:26px}
h2{font-size:26px;margin:0 0 6px;font-weight:650}
.lead{color:var(--muted);margin:0 0 24px;max-width:80ch}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 18px;margin-bottom:14px}
.sechead h2,.sechead .lead{margin:0}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
/* overview */
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 16px;margin-bottom:14px}
.play{min-height:44px;min-width:138px;padding:0 20px;border-radius:999px;border:1px solid rgba(var(--a),.45);background:rgba(var(--a),.13);color:var(--accent);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background-color .2s}
.play:hover{background:rgba(var(--a),.22)}
.tlmonth{min-width:176px}
.tlmonth b{display:block;font-size:24px;line-height:1.25;font-weight:650}
.tlmonth small{color:var(--muted);font-size:13px}
.ctrl input[type=range]{flex:1 1 240px;height:44px;accent-color:var(--accent);margin:0;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button,.tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;transition:color .2s,border-color .2s,background-color .2s}
.chips button:hover,.tabs button:hover{color:var(--ink)}
.chips button.on,.tabs button[aria-pressed=true]{color:var(--accent);border-color:rgba(var(--a),.45);background:rgba(var(--a),.1)}
.ovgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.panel{padding:14px 18px 8px;display:flex;flex-direction:column;min-width:0}
.panel h3{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.pv{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;margin:0 0 6px}
.pv b{font-size:36px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.pv span{color:var(--muted);font-size:13px}
.pv .st{display:inline-flex;align-items:baseline;gap:6px;margin-inline-end:12px}
.pv .st i{width:9px;height:9px;border-radius:2px;display:inline-block;align-self:center}
.pv .st b{font-size:30px;margin-inline-start:2px;color:var(--ink)}
.pc{margin-top:auto}
.pc svg{display:block;width:100%;height:auto;direction:ltr;touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none}
.pc rect.b{opacity:.14}
.pc rect.b.on{opacity:.95}
.pc path.ghost{opacity:.2}
.pc .ph{stroke:rgba(255,255,255,.22);stroke-dasharray:3 3}
.pc.anim rect.b{transition:opacity .25s ease}
.pc.anim path.live{transition:stroke-dashoffset .2s ease-out}
.pc.anim .dot,.pc.anim .ph{transition:transform .2s ease-out}
.playing .pc.anim rect.b{transition:opacity .5s ease}
.playing .pc.anim path.live{transition:stroke-dashoffset .64s linear}
.playing .pc.anim .dot,.playing .pc.anim .ph{transition:transform .64s linear}
.marks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;margin-top:auto;padding-bottom:10px;max-width:190px}
.marks i{display:block;aspect-ratio:1;border-radius:22%;background:var(--track);transition:background-color .4s}
.marks i.on{background:var(--s1)}
.people{display:flex;gap:6px;flex-wrap:wrap}
.people i{width:14px;height:19px;border-radius:7px 7px 3px 3px;background:var(--s1);display:inline-block;transition:background-color .4s}
.people i.off{background:var(--track)}
.panel .people{margin-top:auto;padding-bottom:12px;gap:8px}
.panel .people i{width:20px;height:27px;border-radius:10px 10px 5px 5px}
/* key numbers */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.metric{padding:20px 22px}
.metric h3{margin:0 0 2px;font-size:17px;font-weight:600}
.metric .q{color:var(--muted);font-size:14px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(120px,34%) 1fr auto;gap:12px;align-items:center;margin-top:10px}
.bar .d{color:var(--muted);font-size:14px}
.bar .t{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar .f{display:block;height:100%;background:var(--s1);border-radius:3px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1) .15s}
.in .bar .f{width:var(--w)}
.bar .n{font-size:26px;font-weight:650;min-width:3ch;text-align:end;line-height:1.1;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;margin-top:14px}
.neg{color:#f0a6a6}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.atile{padding:18px 22px}
.atile .big{font-size:38px;font-weight:650;line-height:1.25}
.atile .lab{font-weight:600;font-size:16px;margin-top:2px}
.atile .sub{color:var(--muted);font-size:14px}
/* static chart (team page) */
.charts{display:grid;gap:14px}
.chart{padding:18px 20px 10px;position:relative;min-width:0}
.chart h3{margin:0;font-size:17px;font-weight:600}
.chart .sub{color:var(--muted);font-size:14px;margin:2px 0 8px}
.chart svg{display:block;width:100%;height:auto;direction:ltr}
.chart rect.bm{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.chart.in rect.bm{transform:scaleY(1)}
.tip{position:absolute;pointer-events:none;background:rgba(14,14,16,.94);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:none;min-width:160px;z-index:3}
.tip b{display:block;margin-bottom:2px}
.tip span{display:flex;justify-content:space-between;gap:14px}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 16px;text-align:end;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.055)}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:13px}
th:first-child,td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:rgba(15,15,17,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
tr.total td{font-weight:650}
tr.head td{color:var(--accent);font-weight:600;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 12px}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.person{padding:20px 22px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--track);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.person h3{margin:0;font-size:17px;font-weight:600}
.person .from{color:var(--muted);font-size:14px}
.person .sal{font-size:38px;font-weight:650;line-height:1.25;margin-top:8px;font-variant-numeric:tabular-nums}
.person .per{color:var(--muted);font-size:14px}
.person .later{display:flex;gap:28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);min-height:62px}
.person .later b{display:block;font-size:19px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.teamhead{padding-top:52px;padding-bottom:8px}
.teamhead h1{font-size:clamp(30px,4vw,50px);line-height:1.15;margin:0 0 10px;font-weight:650}
footer{padding:28px 0 48px;color:var(--faint);font-size:13px;border-top:1px solid var(--line)}
@media (max-width:1180px){.c2,.c3,.c4,.c5{grid-column:span 6}.ovgrid>.panel:last-child{grid-column:span 12}}
@media (max-width:760px){nav .wrap{flex-wrap:nowrap;overflow-x:auto;gap:0 18px;scrollbar-width:none}nav .wrap::-webkit-scrollbar{display:none}nav b{display:none}nav a,nav .lang{white-space:nowrap;flex:0 0 auto}section{padding:38px 0}.chips button,.tabs button{min-height:44px}}
@media (max-width:680px){.ovgrid>.panel{grid-column:span 12!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.reveal{opacity:1;transform:none}}

/* Studio workspace additions follow the current theme until reference images are supplied. */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.studio-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin:22px 0}
.studio-card,.week-card,.cycle-step,.editor{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--glass)}
.studio-card h3,.week-card h3,.cycle-step h3{margin:0 0 8px;font-weight:600}
.studio-card p,.cycle-step p{color:var(--muted);margin:8px 0}
.vision{font-size:clamp(23px,2.4vw,34px);line-height:1.4;color:var(--ink)!important;max-width:40ch}
.badge{display:inline-block;font-size:12px;letter-spacing:.03em;color:var(--accent);background:rgba(var(--a),.09);border:1px solid rgba(var(--a),.25);padding:4px 10px;border-radius:30px}
.section-tools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.section-tools h2{margin:0}.section-tools button,.editor button,.week-card button{min-height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--glass);color:var(--ink)}
.week-card{margin-bottom:16px}.week-card time{color:var(--accent);font-size:13px}.week-card .summary{font-size:20px;margin:12px 0}.week-body{white-space:pre-wrap;color:var(--muted)}
.editor{margin:18px 0}.editor summary{cursor:pointer;font-weight:600}.form-grid{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin:20px 0 14px}.form-grid .full{grid-column:1/-1}
.editor input,.editor textarea,.budget-input{width:100%;background:#141415;color:var(--ink);border:1px solid #55514b;border-radius:8px;padding:10px 12px;font:inherit}.editor textarea{min-height:180px;resize:vertical}.editor label{color:var(--muted)}
.cycle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0;list-style:none;counter-reset:cycle}.cycle-step{counter-increment:cycle}.cycle-step:before{content:counter(cycle,decimal-leading-zero);display:block;color:var(--accent);font-size:13px;margin-bottom:14px}.cycle-step h3{font-size:18px}.cycle-step small{color:var(--accent)}
.source-links{font-size:13px;color:var(--muted)}.source-links a,.studio-card a{color:var(--accent)}.forecast-status{padding:14px 18px;border-inline-start:2px solid var(--accent);background:rgba(var(--a),.05)}
.budget-form{display:flex;flex-wrap:wrap;align-items:end;gap:16px}.budget-form label{flex:1;min-width:200px;margin:0}.budget-form button{min-height:48px}.empty-state{border:1px dashed rgba(var(--a),.35)}
@media(max-width:900px){.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}.studio-grid{grid-template-columns:1fr}}
@media(max-width:600px){.cycle,.form-grid{grid-template-columns:1fr}.studio-card,.week-card,.cycle-step,.editor{padding:18px}.form-grid .full{grid-column:auto}}

/* Visual direction: user's style-ref-1 and style-ref-2. */
:root{--bg:#24282c;--ink:#f1f0e6;--muted:#b9bebc;--faint:#a3aba9;--accent:#c2df74;--a:194,223,116;--glass:rgba(36,40,44,.94);--line:rgba(231,237,222,.15);--track:rgba(231,237,222,.09);--s1:#c2df74;--s2:#79b5d9}
body{font-family:Inter,system-ui,sans-serif;background-color:var(--bg);background-image:linear-gradient(rgba(212,220,220,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(212,220,220,.045) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
.wrap{max-width:1480px;padding-inline:clamp(20px,4vw,64px)}
nav{background:rgba(31,35,39,.96);backdrop-filter:blur(12px)}nav .wrap{gap:4px 20px}nav b{font-weight:800;letter-spacing:.08em;font-size:13px}nav a{font-size:13px}
header.hero{padding:68px 0 40px}.hero h1{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:800;font-size:clamp(48px,6.5vw,96px);line-height:.98;letter-spacing:-.015em;max-width:24ch;margin:34px 0 24px}.hero h1 span{color:var(--accent)}.hero p{font-size:16px;max-width:86ch}.hero .forecast-status{font-size:13px;margin-top:18px}
.eyebrow{color:var(--ink);font-size:12px;letter-spacing:.13em;position:relative;padding-bottom:12px;margin-bottom:10px;display:inline-block}.eyebrow:after{content:'';position:absolute;bottom:0;inset-inline-start:0;width:90px;height:4px;background:var(--accent);border-radius:65% 40% 50% 45%;transform:rotate(-1deg)}
h2,.teamhead h1{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-weight:700}h2{font-size:38px;line-height:1.15;margin-bottom:12px}.teamhead h1{font-size:64px}
.tile,.metric,.panel,.atile,.person,.ctrl,.chart,.scroll,.studio-card,.week-card,.cycle-step,.editor{border-radius:7px;box-shadow:none}.tile{border-top:2px solid var(--accent);padding:20px 22px}.tile .v,.atile .big,.person .sal{font-family:'Barlow Condensed',Impact,sans-serif;color:var(--accent);font-size:46px;font-weight:700;line-height:1.1}.tile .k{text-transform:uppercase;letter-spacing:.06em;font-size:12px}.tile .u{margin-top:10px;font-size:12px}.tiles{gap:16px;margin-top:36px}
section{padding:56px 0;background:rgba(30,34,38,.22)}section:nth-of-type(even){background:rgba(30,34,38,.45)}.lead{font-size:15px;line-height:1.75}.bar .t{height:10px;background:transparent;border:1px solid #7e8787;padding:2px;border-radius:12px}.bar .f{height:4px}.bar .n{color:var(--accent)}.bar .d{font-size:13px}.pv b{font-family:'Barlow Condensed',Impact,sans-serif;font-size:40px}.neg{color:#f3a5a0}.person .sal{margin-top:16px}.avatar{border:1px solid rgba(var(--a),.35);background:rgba(var(--a),.04);border-radius:10px}
.studio-card h3,.week-card h3,.cycle-step h3{color:var(--ink)}.vision{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:600;font-size:36px!important;line-height:1.2!important}.cycle-step{border-top:2px solid rgba(var(--a),.5)}.cycle-step:before{font-family:'Barlow Condensed',Impact,sans-serif;font-size:28px;line-height:1}.cycle-step p{font-size:14px}.cycle-step small{font-size:12px}.cycle-step:nth-child(3n+2){border-top-color:var(--s2)}.cycle-step:nth-child(3n+2):before{color:var(--s2)}
.week-card{border-inline-start:3px solid var(--accent)}.week-body{line-height:1.9;font-size:15px}.week-card .summary{font-size:25px}.badge{border-radius:4px;text-transform:uppercase;font-size:11px;letter-spacing:.07em}.editor input,.editor textarea,.budget-input{background:#1d2226;border-color:#596266}th:first-child,td:first-child{background:#252a2e}.tip{background:#1c2226}.editor button[type=submit],.section-tools button{background:var(--accent);color:#22272b;border-color:var(--accent);font-weight:600}.source-links{line-height:1.9}footer{background:#202529}
html[lang=fa] h1,html[lang=fa] h2,html[lang=fa] .vision,html[lang=fa] .tile .v,html[lang=fa] .atile .big,html[lang=fa] .person .sal,html[lang=fa] .pv b{font-family:Vazirmatn,Tahoma,sans-serif;letter-spacing:0;line-height:1.5}html[lang=fa] .hero h1{font-size:clamp(36px,4.5vw,68px)}html[lang=fa] h2{font-size:28px}html[lang=fa] .vision{font-size:28px!important}html[lang=fa] .tile .v{font-size:34px}
@media(max-width:760px){header.hero{padding-top:40px}.hero h1{font-size:clamp(44px,9vw,68px);line-height:1.02}.wrap{padding-inline:20px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:16px}.tile .v{font-size:36px}.tile .u{font-size:11px}h2{font-size:32px}.vision{font-size:30px!important}.teamhead h1{font-size:48px}}
@media(max-width:420px){.tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:30px}.tile .k{font-size:10px}}
.vision-grid{grid-template-columns:1fr}.vision-grid .vision{max-width:60ch}
</style>
</head>
<body>

<div id="app">
  <nav><div class="wrap"><b data-t="brand"></b><a href="#progress" data-t="navProgress"></a><a href="#studio" data-t="navStudio"></a><a href="#overview" data-t="navOverview"></a><a href="#glance" data-t="navGlance"></a><a href="#assumptions" data-t="navAssum"></a><a href="#statements" data-t="navStatements"></a><a href="#team" data-t="navTeam"></a><button class="lang" type="button" data-lang></button></div></nav>
  <div id="view-plan">
    <header class="hero"><div class="wrap">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="tiles" id="tiles"></div>
    </div></header>
    <section id="progress"><div class="wrap" id="progress-content"></div></section>
    <section id="studio"><div class="wrap" id="studio-content"></div></section>
    <section id="overview"><div class="wrap"><div class="sechead"><h2 data-t="navOverview"></h2><p class="lead" data-t="ovLead"></p></div><div id="ovbox"></div></div></section>
    <section id="glance"><div class="wrap"><h2 data-t="navGlance"></h2><p class="lead" data-t="glanceLead"></p><div class="glance" id="glancegrid"></div></div></section>
    <section id="assumptions"><div class="wrap"><h2 data-t="assumH"></h2><p class="lead" data-t="assumLead"></p><div class="kgrid" id="kgrid"></div><div id="staffing-controls"></div></div></section>
    <section id="statements"><div class="wrap"><h2 data-t="stH"></h2><p class="lead" data-t="stLead"></p>
      <div class="scroll"><table id="ytable"></table></div>
      <div class="tabs" id="tabs"></div>
      <div class="scroll"><table id="mtable"></table></div>
    </div></section>
  </div>

 ['Solution design & feasibility','طراحی راهکار و امکان‌سنجی','Define UX flow, features, integrations, data access, human approvals and acceptance metrics. Test the riskiest assumption with a small proof of concept.','جریان تجربه کاربر، امکانات، اتصال‌ها، دسترسی داده، تأیید انسانی و معیار پذیرش را تعریف کنید؛ پرریسک‌ترین فرض را آزمایش کنید.','Feasible, measurable scope','دامنه قابل اجرا و سنجش'],
 ['MVP development','توسعه محصول اولیه','Build the smallest usable workflow with reusable modules. Include access control, logging, evaluation examples and deployment automation.','کوچک‌ترین فرایند قابل استفاده را با ماژول‌های قابل استفاده مجدد بسازید؛ کنترل دسترسی، ثبت رویداد و نمونه‌های ارزیابی را اضافه کنید.','Working end-to-end workflow','فرایند عملیاتی از ابتدا تا انتها'],
 ['Internal QA & AI evaluation','آزمون داخلی و ارزیابی هوش مصنوعی','Check functional behavior, representative Persian tasks, edge cases, security, reliability, latency and cost per completed task.','کارکرد، وظایف فارسی واقعی، موارد مرزی، امنیت، پایداری، تأخیر و هزینه هر کار تکمیل‌شده را بسنجید.','Pass agreed test thresholds','عبور از آستانه‌های توافق‌شده'],
 ['Design-partner pilot & UAT','پایلوت با مشتری و آزمون پذیرش','Run a limited real-world pilot with a committed customer. Compare outcomes against the baseline and confirm buyer acceptance and pricing.','با مشتری متعهد پایلوت محدود اجرا کنید؛ نتیجه را با خط پایه مقایسه و پذیرش خریدار و قیمت را تأیید کنید.','Verified value and acceptance','ارزش اثبات‌شده و پذیرش مشتری'],
 ['Launch & commercialization','عرضه و تجاری‌سازی','Finalize onboarding, contracts, pricing, support, service levels and rollback. Start targeted outreach during discovery; expand promotion after pilot evidence.','آموزش و ورود مشتری، قرارداد، قیمت، پشتیبانی، سطح خدمت و بازگشت نسخه را آماده کنید. ارتباط هدفمند از کشف مسئله شروع می‌شود و بعد از پایلوت گسترش می‌یابد.','Production-ready service','خدمت آماده بهره‌برداری'],
 ['Operate, learn & expand','بهره‌برداری، یادگیری و توسعه','Monitor adoption, savings, errors and margins. Feed customer evidence back into prioritization; improve shared modules and cross-sell where useful.','استفاده، صرفه‌جویی، خطا و حاشیه سود را پایش کنید؛ بازخورد را به اولویت‌بندی برگردانید و ماژول‌های مشترک را بهبود دهید.','Continuous improvement','بهبود مستمر']
];
function renderStudio(){
 $('studio-content').innerHTML=`<div class="eyebrow">${tr('Direction & delivery','جهت‌گیری و اجرا')}</div><h2>${tr('Enterprise AI Solutions Studio','استودیوی راهکارهای هوش مصنوعی سازمانی')}</h2><div class="studio-grid vision-grid"><article class="studio-card"><span class="badge">${tr('Our vision','چشم‌انداز ما')}</span><p class="vision">${tr('Help enterprises reduce operating costs through modular AI services that automate repetitive work across departments.','کاهش هزینه‌های عملیاتی سازمان‌ها با خدمات ماژولار هوش مصنوعی که کارهای تکراری واحدهای مختلف را خودکار می‌کنند.')}</p></article></div><div class="studio-grid"><article class="studio-card empty-state"><span class="badge">${tr('Pending input','در انتظار اطلاعات')}</span><h3>${tr('Product portfolio','سبد محصولات')}</h3><p>${tr('Product list coming soon.','فهرست محصولات به‌زودی اضافه می‌شود.')}</p></article><article class="studio-card"><span class="badge">${tr('Research completed','بررسی انجام‌شده')}</span><h3>${tr('Hamkaran System BI','BI همکاران')}</h3><p>${tr('Approximately 30 million tomans per month.','حدود ۳۰ میلیون تومان در ماه.')}</p></article></div><h2>${tr('Production cycle','چرخه تولید')}</h2><ol class="cycle">${cycleSteps.map(x=>`<li class="cycle-step"><h3>${esc(x[lang==='fa'?1:0])}</h3><p>${esc(x[lang==='fa'?3:2])}</p><small>${tr('Gate: ','شرط عبور: ')}${esc(x[lang==='fa'?5:4])}</small></li>`).join('')}</ol>`;
}
function renderStaffing(){
 $('staffing-controls').innerHTML=`<div class="editor"><h3>${tr('Hiring & delivery budget','بودجه جذب و اجرا')}</h3><p class="note">${tr('Project support: after finalizing two projects. Sales hire: after onboarding the third company.','همکاری پروژه‌ای: پس از نهایی‌سازی دو پروژه. جذب فروش: پس از ورود شرکت سوم.')}</p><form id="budget-form" class="budget-form"><label>${tr('Monthly contractor reserve · 1405 tomans (millions)','ذخیره ماهانه پیمانکار · میلیون تومان ۱۴۰۵')}<input class="budget-input" id="contractor-budget" type="number" min="0" max="100000" step="0.5" value="${staffing.contractor}" required></label><label>${tr('Monthly sales commission allowance · 1405','ذخیره ماهانه پورسانت فروش · ۱۴۰۵')}<input class="budget-input" id="commission-budget" type="number" min="10" max="15" step="0.5" value="${staffing.commission}" required></label><button type="submit">${tr('Recalculate forecast','محاسبه مجدد')}</button></form><p class="note">${tr('Core salaries: 323. Sales: 25 fixed + 10–15 commission. Annual increase: 40%.','حقوق تیم اصلی: ۳۲۳. فروش: ۲۵ ثابت + ۱۰ تا ۱۵ پورسانت. رشد سالانه: ۴۰٪.')}</p></div>`;
 $('budget-form').onsubmit=e=>{e.preventDefault();const c=Number($('contractor-budget').value),v=Number($('commission-budget').value);if(!Number.isFinite(c)||!Number.isFinite(v)||c<0||c>100000||v<10||v>15)return;staffing.contractor=c;staffing.commission=v;tlStop();recalculatePlan();render(DATA);};
}

route();
